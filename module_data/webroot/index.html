<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>KSU SSH</title>
  <link rel="stylesheet" href="internal/colors.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>KSU SSH</h1>

    <div class="page-panel active" data-page="home">
      <section id="status" class="status" aria-labelledby="service-title">
        <div class="status-main">
          <div>
            <p class="status-line"><span class="dot" aria-hidden="true"></span><span id="service-title">Checking</span></p>
            <p id="service-detail" class="status-detail" hidden></p>
          </div>
          <div class="service-actions">
            <button id="service-restart" class="tonal" type="button" hidden>Restart</button>
            <button id="service-toggle" class="primary" type="button" hidden>Start</button>
          </div>
        </div>
        <button id="address-row" class="address" type="button" hidden>
          <code id="address-command"></code>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
          <span class="sr-only">Copy</span>
        </button>
      </section>

      <section aria-labelledby="server-heading">
        <h2 id="server-heading">Server</h2>
        <div class="group">
          <label class="row">
            <span class="row-text">Start on boot</span>
            <input id="autostart" class="switch" type="checkbox">
          </label>
          <button id="port-row" class="row" type="button">
            <span class="row-text">Port</span>
            <span id="port-value" class="value"></span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </div>
      </section>

      <section aria-labelledby="signin-heading">
        <h2 id="signin-heading">Sign-in</h2>
        <div class="group">
          <label class="row">
            <span class="row-text">Password sign-in<small>For shell, and for root when allowed below</small></span>
            <input id="password-auth" class="switch" type="checkbox">
          </label>
          <div class="row stacked">
            <span id="root-login-label" class="row-text">Root</span>
            <div class="segmented" role="radiogroup" aria-labelledby="root-login-label">
              <label><input id="root-off" type="radio" name="root-login" value="disabled"><span>Off</span></label>
              <label><input id="root-keys" type="radio" name="root-login" value="keys"><span>Key</span></label>
              <label><input id="root-password" type="radio" name="root-login" value="password"><span>Key or password</span></label>
            </div>
            <small id="root-password-help" hidden></small>
          </div>
        </div>
        <p class="footnote">Shell can always sign in with a key. Set passwords from a root terminal with <code>passwd shell</code> and <code>passwd root</code>.</p>
      </section>
    </div>

    <div class="page-panel" data-page="keys" hidden>
      <div class="tabs" role="tablist" aria-label="Account">
        <button id="root-tab" role="tab" aria-selected="true" type="button">Root</button>
        <button id="shell-tab" role="tab" aria-selected="false" type="button">Shell</button>
      </div>
      <div id="key-list" class="group key-list" aria-live="polite"></div>
      <button id="add-key" class="tonal wide" type="button">Add key</button>
    </div>

    <div class="page-panel" data-page="advanced" hidden>
      <label class="editor-label" for="config-editor">/data/ssh/sshd_config</label>
      <textarea id="config-editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <button id="save-config" class="primary wide" type="button">Validate and save</button>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Pages">
    <button class="nav-item active" data-target="home" aria-current="page" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="m7.5 10 3 2.5-3 2.5M13 15h3.5"/></svg>
      <span>SSH</span>
    </button>
    <button class="nav-item" data-target="keys" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M16 7l2.5 2.5M13.5 9.5l2 2"/></svg>
      <span>Keys</span>
    </button>
    <button class="nav-item" data-target="advanced" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3.5H7A2.5 2.5 0 0 0 4.5 6v12A2.5 2.5 0 0 0 7 20.5h10a2.5 2.5 0 0 0 2.5-2.5V9z"/><path d="M14 3.5V9h5.5M8.5 13h7M8.5 16.5h5"/></svg>
      <span>Config</span>
    </button>
  </nav>

  <dialog id="key-dialog">
    <form method="dialog">
      <h2>Add key for <span id="key-user">root</span></h2>
      <label for="key-input">Paste one public key, such as the contents of <code>~/.ssh/id_ed25519.pub</code></label>
      <textarea id="key-input" rows="5" placeholder="ssh-ed25519 AAAA… laptop" spellcheck="false" autocapitalize="off"></textarea>
      <p id="key-error" class="form-error" aria-live="polite"></p>
      <div class="dialog-actions"><button value="cancel" class="text">Cancel</button><button id="confirm-key" value="default" class="primary">Add key</button></div>
    </form>
  </dialog>

  <dialog id="port-dialog">
    <form method="dialog">
      <h2>Port</h2>
      <label for="port-input">1 to 65535</label>
      <input id="port-input" type="number" min="1" max="65535" inputmode="numeric">
      <p id="port-error" class="form-error" aria-live="polite"></p>
      <div class="dialog-actions"><button value="cancel" class="text">Cancel</button><button id="confirm-port" value="default" class="primary">Save</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
